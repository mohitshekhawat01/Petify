<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <title>Reset Password - Petify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-layout { height:100vh; display:grid; grid-template-columns:1fr 1fr; }
        .auth-left {
            background: linear-gradient(135deg, var(--brown), #1a0e05);
            color: var(--white); display:flex; flex-direction:column;
            justify-content:center; padding:80px; position:relative; overflow:hidden;
        }
        .auth-left::before { content:'🐾'; position:absolute; bottom:-50px; left:-50px; font-size:400px; opacity:0.05; transform:rotate(-15deg); }
        .auth-quote { font-family:var(--font-serif); font-size:46px; line-height:1.2; margin-bottom:20px; z-index:2; }
        .auth-author { font-size:14px; text-transform:uppercase; letter-spacing:2px; color:var(--gold); z-index:2; }
        .auth-right { background:var(--ivory); display:flex; align-items:center; justify-content:center; padding:60px; }
        .auth-box { width:100%; max-width:440px; background:var(--white); padding:50px; border-radius:24px; border:1px solid var(--ivory3); box-shadow:0 20px 40px rgba(74,40,16,0.05); }
        .form-group { margin-bottom:20px; }
        .form-label { display:block; font-size:13px; font-weight:500; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
        .form-input { width:100%; padding:14px 20px; background:var(--ivory2); border:1px solid var(--ivory3); border-radius:12px; font-size:15px; color:var(--brown); transition:all 0.3s; }
        .form-input:focus { outline:none; border-color:var(--gold); background:var(--white); box-shadow:0 0 0 4px rgba(201,151,58,0.1); }
        .pwd-wrap { position:relative; display:flex; align-items:center; }
        .pwd-wrap .form-input { padding-right:46px; }
        .pwd-toggle { position:absolute; right:13px; background:none; border:none; cursor:pointer; font-size:15px; color:var(--text-muted); transition:color 0.2s; padding:0; }
        .pwd-toggle:hover { color:var(--gold); }
        .auth-btn { width:100%; padding:16px; font-size:16px; margin-top:10px; }
        .auth-error { color:var(--red); font-size:13px; margin-bottom:15px; text-align:center; display:none; }
        .auth-success { color:#0e7a52; font-size:13px; margin-bottom:15px; text-align:center; background:#d4f4e8; padding:12px; border-radius:10px; display:none; }
        .strength-bar { height:4px; border-radius:4px; margin-top:6px; background:var(--ivory3); transition:all 0.3s; }
        .strength-bar-fill { height:100%; border-radius:4px; transition:all 0.4s; }
        @media(max-width:900px) { .auth-layout{grid-template-columns:1fr;} .auth-left{display:none;} }
    </style>
</head>
<body>
    <div class="auth-layout">
        <a href="login.html" style="position:absolute;top:40px;left:40px;color:var(--white);font-weight:500;display:flex;align-items:center;gap:10px;z-index:10;text-transform:uppercase;letter-spacing:1px;font-size:13px;">← Back to Login</a>

        <div class="auth-left">
            <h1 class="auth-quote">"A new beginning for you and your pet."</h1>
            <span class="auth-author">— Petify</span>
        </div>

        <div class="auth-right">
            <div class="auth-box">
                <div style="margin-bottom:28px;">
                    <h2 style="font-family:var(--font-serif);font-size:32px;color:var(--brown);margin-bottom:8px;">Set New Password</h2>
                    <p style="font-size:14px;color:var(--text-muted);line-height:1.6;">Choose a strong password for your Petify account.</p>
                </div>

                <div class="auth-error" id="auth-error">Error message here</div>
                <div class="auth-success" id="auth-success">✅ Password reset! <a href="login.html" style="color:var(--gold);font-weight:600;">Sign in now →</a></div>

                <div id="invalid-token" style="display:none;text-align:center;padding:20px 0;">
                    <div style="font-size:48px;margin-bottom:16px;">⏰</div>
                    <p style="color:var(--red);font-weight:600;margin-bottom:8px;">Reset link has expired or is invalid.</p>
                    <a href="forgot-password.html" style="color:var(--gold);font-weight:600;font-size:14px;">Request a new link →</a>
                </div>

                <form id="reset-form" onsubmit="handleResetPassword(event)">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="pwd-wrap">
                            <input type="password" id="rp-password" class="form-input" placeholder="Min. 6 characters" oninput="checkStrength(this.value)" required>
                            <button type="button" class="pwd-toggle" onclick="toggleVis('rp-password')">👁</button>
                        </div>
                        <div class="strength-bar"><div class="strength-bar-fill" id="strength-fill"></div></div>
                        <div id="strength-label" style="font-size:11px;color:var(--text-muted);margin-top:4px;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <div class="pwd-wrap">
                            <input type="password" id="rp-confirm" class="form-input" placeholder="Re-enter password" required>
                            <button type="button" class="pwd-toggle" onclick="toggleVis('rp-confirm')">👁</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary auth-btn" id="rp-btn">Reset Password</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/cursor.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        if (!resetToken) {
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('invalid-token').style.display = 'block';
        }

        function toggleVis(id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        }

        function checkStrength(val) {
            const fill = document.getElementById('strength-fill');
            const label = document.getElementById('strength-label');
            if (!val) { fill.style.width = '0'; label.textContent = ''; return; }
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const levels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            const colors = ['', '#dc3545', '#fd7e14', '#ffc107', '#28a745', '#0e7a52'];
            fill.style.width = (score * 20) + '%';
            fill.style.background = colors[score];
            label.textContent = levels[score];
            label.style.color = colors[score];
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const btn = document.getElementById('rp-btn');
            const errEl = document.getElementById('auth-error');
            const sucEl = document.getElementById('auth-success');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            const password = document.getElementById('rp-password').value;
            const confirm  = document.getElementById('rp-confirm').value;

            if (password.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errEl.textContent = 'Passwords do not match.';
                errEl.style.display = 'block';
                return;
            }

            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                await API.resetPassword(resetToken, password);
                sucEl.style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';
            } catch(err) {
                if (err.message && err.message.toLowerCase().includes('expired')) {
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('invalid-token').style.display = 'block';
                } else {
                    errEl.textContent = err.message || 'Reset failed. Please try again.';
                    errEl.style.display = 'block';
                    btn.textContent = 'Reset Password';
                    btn.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
