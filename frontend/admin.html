<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Petify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brown: #4a2810; --gold: #c9973a; --ivory: #fdf9f3;
            --ivory2: #f7f1e8; --ivory3: #ebe3d5; --text-muted: #8c7a6b;
            --red: #d9534f; --green: #2e8b57; --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Jost', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font-sans); background: #0f0603; color: #fff; min-height: 100vh; }

        /* ── Login Screen ── */
        #login-screen {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #0f0603, #2d1205, #4a2810);
        }
        .login-box {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(201,151,58,0.2);
            border-radius: 24px; padding: 48px 40px; width: 100%; max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .login-logo { font-family: var(--font-serif); font-size: 36px; color: var(--gold); text-align: center; margin-bottom: 8px; }
        .login-sub { text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 36px; letter-spacing: 2px; text-transform: uppercase; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 13px 16px; border-radius: 10px;
            border: 1.5px solid rgba(201,151,58,0.2); background: rgba(255,255,255,0.05);
            color: #fff; font-size: 15px; font-family: var(--font-sans); outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--gold); }
        .login-btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, var(--gold), #e8b85a);
            color: var(--brown); font-weight: 700; font-size: 15px; cursor: pointer;
            margin-top: 8px; transition: all 0.3s; font-family: var(--font-sans);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201,151,58,0.3); }
        .login-err { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

        /* ── Dashboard ── */
        #dashboard { display: none; }
        .admin-nav {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(201,151,58,0.15);
            padding: 18px 40px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .admin-brand { font-family: var(--font-serif); font-size: 24px; color: var(--gold); }
        .admin-brand span { font-size: 13px; color: rgba(255,255,255,0.4); margin-left: 10px; font-family: var(--font-sans); }
        .logout-btn {
            padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(201,151,58,0.4);
            color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer;
            background: none; transition: all 0.2s; font-family: var(--font-sans);
        }
        .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

        .admin-body { max-width: 1400px; margin: 0 auto; padding: 40px; }

        /* ── Stats Row ── */
        .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px; padding: 24px; position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
        .stat-value { font-family: var(--font-serif); font-size: 40px; color: var(--gold); }
        .stat-icon { position: absolute; right: 20px; top: 20px; font-size: 28px; opacity: 0.2; }

        /* ── Toolbar ── */
        .orders-toolbar {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
        }
        .orders-toolbar h2 { font-family: var(--font-serif); font-size: 32px; color: #fff; }
        .filter-row { display: flex; gap: 10px; }
        .filter-btn {
            padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 500;
            border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.55);
            cursor: pointer; background: none; transition: all 0.2s; font-family: var(--font-sans);
        }
        .filter-btn:hover, .filter-btn.active { background: var(--gold); color: var(--brown); border-color: var(--gold); }
        .refresh-btn {
            padding: 9px 20px; border-radius: 20px; border: 1px solid rgba(201,151,58,0.4);
            color: var(--gold); background: rgba(201,151,58,0.07); font-size: 13px;
            cursor: pointer; font-family: var(--font-sans); transition: all 0.2s;
        }
        .refresh-btn:hover { background: rgba(201,151,58,0.15); }

        /* ── Orders Table ── */
        .orders-table {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px; overflow: hidden;
        }
        .table-head {
            display: grid; grid-template-columns: 160px 1fr 140px 100px 130px 120px 120px;
            padding: 14px 24px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.35);
        }
        .order-row {
            display: grid; grid-template-columns: 160px 1fr 140px 100px 130px 120px 120px;
            padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center; transition: background 0.2s;
        }
        .order-row:last-child { border-bottom: none; }
        .order-row:hover { background: rgba(255,255,255,0.03); }
        .order-id { font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.4); }
        .order-customer strong { display: block; font-size: 14px; color: #fff; }
        .order-customer span { font-size: 12px; color: rgba(255,255,255,0.4); }
        .order-items { font-size: 13px; color: rgba(255,255,255,0.6); }
        .order-total { font-family: var(--font-serif); font-size: 18px; color: var(--gold); }
        .pay-badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .pay-paid { background: rgba(46,139,87,0.2); color: #4ade80; }
        .pay-pending { background: rgba(255,165,0,0.15); color: #fbbf24; }
        .pay-cod { background: rgba(100,149,237,0.15); color: #93c5fd; }
        .status-select {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px;
            cursor: pointer; outline: none; font-family: var(--font-sans);
            transition: border-color 0.2s; width: 100%;
        }
        .status-select:focus { border-color: var(--gold); }
        .action-btn {
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(201,151,58,0.3);
            color: var(--gold); font-size: 12px; cursor: pointer; background: none;
            font-family: var(--font-sans); transition: all 0.2s; display: block;
            text-align: center; margin-bottom: 6px;
        }
        .action-btn:hover { background: rgba(201,151,58,0.15); }
        .delete-btn {
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(217,83,79,0.4);
            color: #ff6b6b; font-size: 12px; cursor: pointer; background: none;
            font-family: var(--font-sans); transition: all 0.2s; display: block;
            text-align: center;
        }
        .delete-btn:hover { background: rgba(217,83,79,0.15); border-color: #ff6b6b; }

        .empty-orders { text-align: center; padding: 80px; color: rgba(255,255,255,0.3); }
        .empty-orders .icon { font-size: 60px; margin-bottom: 16px; opacity: 0.3; }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: rgba(255,255,255,0.3); font-size: 14px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            background: rgba(46,139,87,0.9); color: #fff; padding: 12px 24px;
            border-radius: 10px; font-size: 14px; backdrop-filter: blur(10px);
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
    <div class="login-box">
        <div class="login-logo">🐾 Petify</div>
        <div class="login-sub">Admin Panel</div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="admin-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter') adminLogin()">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') adminLogin()">
        </div>
        <button class="login-btn" onclick="adminLogin()">Sign In as Admin →</button>
        <div class="login-err" id="login-err"></div>
    </div>
</div>

<!-- ── DASHBOARD ── -->
<div id="dashboard">
    <nav class="admin-nav">
        <div class="admin-brand">🐾 Petify <span>Admin Console</span></div>
        <div style="display:flex;align-items:center;gap:16px;">
            <div style="font-size:13px;color:rgba(255,255,255,0.4);">Welcome, <span id="admin-name" style="color:var(--gold);"></span></div>
            <button class="logout-btn" onclick="adminLogout()">Sign Out</button>
        </div>
    </nav>

    <div class="admin-body">
        <!-- Stats -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-label">Total Orders</div><div class="stat-value" id="s-total">—</div></div>
            <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-label">Revenue</div><div class="stat-value" id="s-revenue">—</div></div>
            <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-label">Pending Orders</div><div class="stat-value" id="s-pending">—</div></div>
            <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Paid Orders</div><div class="stat-value" id="s-paid">—</div></div>
        </div>

        <!-- Orders Table -->
        <div class="orders-toolbar">
            <h2>All Orders</h2>
            <div style="display:flex;gap:12px;align-items:center;">
                <div class="filter-row">
                    <button class="filter-btn active" onclick="filterOrders('all', this)">All</button>
                    <button class="filter-btn" onclick="filterOrders('pending', this)">Pending</button>
                    <button class="filter-btn" onclick="filterOrders('confirmed', this)">Confirmed</button>
                    <button class="filter-btn" onclick="filterOrders('shipped', this)">Shipped</button>
                    <button class="filter-btn" onclick="filterOrders('delivered', this)">Delivered</button>
                </div>
                <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
            </div>
        </div>

        <div class="orders-table">
            <div class="table-head">
                <div>Order ID</div>
                <div>Customer</div>
                <div>Items</div>
                <div>Total</div>
                <div>Payment</div>
                <div>Status</div>
                <div>Actions</div>
            </div>
            <div id="orders-body"><div class="loading">Loading orders...</div></div>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:5000/api';
    let allOrders = [];
    let adminToken = null;

    // ── Auth ──────────────────────────────────────
    async function adminLogin() {
        const email = document.getElementById('admin-email').value.trim();
        const pass  = document.getElementById('admin-pass').value.trim();
        const errEl = document.getElementById('login-err');
        errEl.style.display = 'none';

        try {
            const res  = await fetch(`${API}/auth/login`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Login failed');
            if (!data.isAdmin) throw new Error('This account does not have admin access. Run: node make-admin.js ' + email);

            adminToken = data.token;
            localStorage.setItem('petify_admin_token', adminToken);
            document.getElementById('admin-name').textContent = data.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadOrders();
        } catch(e) {
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        }
    }

    function adminLogout() {
        localStorage.removeItem('petify_admin_token');
        adminToken = null;
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
    }

    // Auto-login if token exists
    window.addEventListener('DOMContentLoaded', async () => {
        const saved = localStorage.getItem('petify_admin_token');
        if (saved) {
            try {
                // Verify token still works by fetching orders
                const r = await fetch(`${API}/orders/all`, { headers: { Authorization: `Bearer ${saved}` } });
                if (r.ok) {
                    adminToken = saved;
                    const profile = await fetch(`${API}/auth/profile`, { headers: { Authorization: `Bearer ${saved}` } });
                    const user = await profile.json();
                    document.getElementById('admin-name').textContent = user.name || 'Admin';
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadOrders();
                    return;
                }
            } catch(e) { /* fall through to login */ }
            localStorage.removeItem('petify_admin_token');
        }
    });

    // ── Load Orders ─────────────────────────────
    async function loadOrders() {
        document.getElementById('orders-body').innerHTML = '<div class="loading">Loading orders...</div>';
        try {
            const res  = await fetch(`${API}/orders/all`, { headers: { Authorization: `Bearer ${adminToken}` } });
            allOrders  = await res.json();
            updateStats(allOrders);
            renderOrders(allOrders);
        } catch(e) {
            document.getElementById('orders-body').innerHTML = `<div class="empty-orders"><div class="icon">⚠️</div><p>Failed to load orders. Is the backend running?</p></div>`;
        }
    }

    function updateStats(orders) {
        document.getElementById('s-total').textContent   = orders.length;
        document.getElementById('s-revenue').textContent = '₹' + orders.filter(o => o.payment?.status === 'paid').reduce((s,o) => s + o.total, 0).toLocaleString('en-IN');
        document.getElementById('s-pending').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('s-paid').textContent    = orders.filter(o => o.payment?.status === 'paid').length;
    }

    function filterOrders(filter, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = filter === 'all' ? allOrders : allOrders.filter(o => o.status === filter);
        renderOrders(filtered);
    }

    function renderOrders(orders) {
        const body = document.getElementById('orders-body');
        if (!orders.length) {
            body.innerHTML = `<div class="empty-orders"><div class="icon">📭</div><p>No orders found</p></div>`;
            return;
        }

        body.innerHTML = orders.map(o => {
            const customer  = o.user ? `<strong>${o.user.name}</strong><span>${o.user.email}</span>` : `<strong>${o.address?.fullName || 'Guest'}</strong><span>Guest Order</span>`;
            const itemNames = (o.items || []).slice(0,2).map(i => i.name).join(', ') + (o.items?.length > 2 ? ` +${o.items.length-2} more` : '');
            const payStatus = o.payment?.status === 'paid' ? 'pay-paid' : (o.payment?.method === 'COD' ? 'pay-cod' : 'pay-pending');
            const payLabel  = o.payment?.status === 'paid' ? 'Paid' : (o.address ? 'COD' : 'Pending');
            const date      = new Date(o.createdAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'2-digit' });

            return `<div class="order-row">
                <div>
                    <div class="order-id">#${o._id.substring(0,8)}...</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:3px;">${date}</div>
                </div>
                <div class="order-customer">${customer}</div>
                <div class="order-items" title="${(o.items||[]).map(i=>i.name).join(', ')}">${itemNames || '—'}</div>
                <div class="order-total">₹${(o.total||0).toLocaleString('en-IN')}</div>
                <div><span class="pay-badge ${payStatus}">${payLabel}</span></div>
                <div>
                    <select class="status-select" onchange="updateStatus('${o._id}', this.value)">
                        <option value="pending"    ${o.status==='pending'?'selected':''}>⏳ Pending</option>
                        <option value="confirmed"  ${o.status==='confirmed'?'selected':''}>✅ Confirmed</option>
                        <option value="processing" ${o.status==='processing'?'selected':''}>🔧 Processing</option>
                        <option value="shipped"    ${o.status==='shipped'?'selected':''}>🚚 Shipped</option>
                        <option value="delivered"  ${o.status==='delivered'?'selected':''}>🎁 Delivered</option>
                        <option value="cancelled"  ${o.status==='cancelled'?'selected':''}>❌ Cancelled</option>
                    </select>
                </div>
                <div>
                    <button class="action-btn" onclick="copyId('${o._id}')">📋 Copy ID</button>
                    <button class="delete-btn" onclick="deleteOrder('${o._id}')">🗑 Delete</button>
                </div>
            </div>`;
        }).join('');
    }

    async function updateStatus(orderId, status) {
        try {
            const res = await fetch(`${API}/orders/${orderId}/status`, {
                method: 'PUT', headers: {'Content-Type':'application/json', Authorization:`Bearer ${adminToken}`},
                body: JSON.stringify({ status })
            });
            if (!res.ok) throw new Error('Failed');
            showToast(`✅ Order marked as ${status}`);
            // Update local data
            const o = allOrders.find(x => x._id === orderId);
            if (o) o.status = status;
            updateStats(allOrders);
        } catch(e) { showToast('❌ Update failed'); }
    }

    function copyId(id) {
        navigator.clipboard.writeText(id);
        showToast('📋 Order ID copied!');
    }

    async function deleteOrder(orderId) {
        if (!confirm('⚠️ Are you sure you want to permanently delete this order? This cannot be undone.')) return;
        try {
            const res = await fetch(`${API}/orders/${orderId}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${adminToken}` }
            });
            if (!res.ok) throw new Error('Failed to delete');
            allOrders = allOrders.filter(o => o._id !== orderId);
            updateStats(allOrders);
            renderOrders(allOrders);
            showToast('🗑 Order deleted successfully');
        } catch(e) {
            showToast('❌ Failed to delete order', 'rgba(217,83,79,0.9)');
        }
    }

    function showToast(msg, color = 'rgba(46,139,87,0.9)') {
        const t = document.createElement('div');
        t.className = 'toast';
        t.style.background = color;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
</script>
</body>
</html>
