<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <title>Auth - Petify</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <style>
        .auth-layout {
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .auth-left {
            background: linear-gradient(135deg, var(--brown), #1a0e05);
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            position: relative;
            overflow: hidden;
        }
        .auth-left::before {
            content: '🐾';
            position: absolute;
            bottom: -50px;
            left: -50px;
            font-size: 400px;
            opacity: 0.05;
            transform: rotate(-15deg);
        }
        .auth-quote {
            font-family: var(--font-serif);
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 20px;
            z-index: 2;
        }
        .auth-author {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            z-index: 2;
        }

        .auth-right {
            background: var(--ivory);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        .auth-box {
            width: 100%;
            max-width: 440px;
            background: var(--white);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid var(--ivory3);
            box-shadow: 0 20px 40px rgba(74, 40, 16, 0.05);
        }
        
        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--ivory3);
        }
        .auth-tab {
            padding: 15px 0;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            transition: color 0.3s;
        }
        .auth-tab.active {
            color: var(--brown);
        }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gold);
        }

        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }

        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--ivory2);
            border: 1px solid var(--ivory3);
            border-radius: 12px;
            font-size: 15px;
            color: var(--brown);
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(201,151,58,0.1);
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            margin-top: 10px;
        }
        .auth-error {
            color: var(--red);
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        /* Eye toggle */
        .pwd-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .pwd-field-wrap .form-input {
            padding-right: 48px;
        }
        .eye-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: color 0.2s;
            cursor: none;
            line-height: 1;
        }
        .eye-btn:hover { color: var(--gold); }

        .back-home {
            position: absolute;
            top: 40px;
            left: 40px;
            color: var(--white);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }
        .back-home:hover { opacity: 0.8; }
        
        @media(max-width: 900px) {
            .auth-layout { grid-template-columns: 1fr; }
            .auth-left { display: none; }
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <a href="index.html" class="back-home">← Back to Store</a>
        
        <div class="auth-left">
            <h1 class="auth-quote">"A house is not a home without a pet."</h1>
            <span class="auth-author">— Anonymous</span>
        </div>
        
        <div class="auth-right">
            <div class="auth-box">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
                    <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
                </div>
                
                <div class="auth-error" id="auth-error">Error message goes here</div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="l-email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="pwd-field-wrap">
                            <input type="password" id="l-password" class="form-input" required>
                            <button type="button" class="eye-btn" onclick="togglePwd('l-password', this)" tabindex="-1" aria-label="Toggle password visibility">
                                <svg id="l-eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <div style="text-align:right;margin-top:8px;">
                            <a href="forgot-password.html" style="font-size:12px;color:var(--gold);text-decoration:none;font-weight:500;">Forgot Password?</a>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary auth-btn" id="l-btn">Sign In</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="s-name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="s-email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="pwd-field-wrap">
                            <input type="password" id="s-password" class="form-input" minlength="6" required>
                            <button type="button" class="eye-btn" onclick="togglePwd('s-password', this)" tabindex="-1" aria-label="Toggle password visibility">
                                <svg id="s-eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary auth-btn" id="s-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/cursor.js"></script>
    <script src="js/api.js"></script>
    <script>
        function togglePwd(inputId, btn) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            // Swap SVG: open eye vs slashed eye
            btn.innerHTML = isHidden
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            btn.style.color = isHidden ? 'var(--gold)' : '';
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
            document.getElementById('auth-error').style.display = 'none';
        }

        function showError(msg) {
            const errEl = document.getElementById('auth-error');
            errEl.textContent = msg;
            errEl.style.display = 'block';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('l-btn');
            btn.textContent = 'Signing in...';
            
            try {
                const res = await API.login({
                    email: document.getElementById('l-email').value,
                    password: document.getElementById('l-password').value
                });
                
                localStorage.setItem('petify_token', res.token);
                localStorage.setItem('petify_user', JSON.stringify({ id: res._id, name: res.name, email: res.email }));
                
                // Merge cart? Handled in cartManager next load
                window.location.href = 'index.html';
            } catch (err) {
                showError(err.message || 'Invalid email or password');
                btn.textContent = 'Sign In';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('s-btn');
            btn.textContent = 'Creating...';
            
            try {
                const res = await API.signup({
                    name: document.getElementById('s-name').value,
                    email: document.getElementById('s-email').value,
                    password: document.getElementById('s-password').value
                });
                
                localStorage.setItem('petify_token', res.token);
                localStorage.setItem('petify_user', JSON.stringify({ id: res._id, name: res.name, email: res.email }));
                
                window.location.href = 'index.html';
            } catch (err) {
                showError(err.message || 'User already exists');
                btn.textContent = 'Create Account';
            }
        }

        // If already logged in, redirect
        if (localStorage.getItem('petify_token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
