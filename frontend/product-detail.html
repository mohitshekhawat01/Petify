<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <title>Product Details - Petify</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .pdp-section {
            padding: 120px 40px 100px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .pdp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }
        .pdp-media {
            position: sticky;
            top: 100px;
        }
        .pdp-main-img {
            width: 100%;
            height: 600px;
            background: linear-gradient(135deg, var(--ivory2) 0%, #e6dfd3 100%);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 140px;
            box-shadow: 0 20px 40px rgba(74, 40, 16, 0.08);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--ivory3);
        }
        .pdp-main-img::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.6) 0%, transparent 70%);
        }
        .pdp-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
        }
        
        .breadcrumb {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
        }
        .breadcrumb a {
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .breadcrumb a:hover {
            color: var(--brown);
        }
        .pdp-title {
            font-size: 42px;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .pdp-rating {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--ivory3);
        }
        .pdp-price-wrap {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 30px;
        }
        .pdp-price {
            font-family: var(--font-serif);
            font-size: 40px;
            font-weight: 600;
            color: var(--brown);
            line-height: 1;
        }
        .pdp-old-price {
            font-size: 20px;
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .pdp-short-desc {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 40px;
        }
        
        .pdp-actions {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }
        .qty-selector {
            display: flex;
            align-items: center;
            background: var(--brown);
            border-radius: 50px;
            padding: 5px;
            gap: 2px;
            box-shadow: 0 4px 16px rgba(74,40,16,0.18);
        }
        .qty-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            font-size: 20px;
            font-weight: 300;
            color: rgba(255,255,255,0.9);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .qty-btn:hover {
            background: var(--gold);
            color: var(--brown);
            transform: scale(1.08);
        }
        .qty-btn:active {
            transform: scale(0.95);
        }
        .qty-input {
            width: 46px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            outline: none;
            -moz-appearance: textfield;
        }
        .qty-input::-webkit-inner-spin-button,
        .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; appearance: none; }
        .pdp-add-btn {
            flex: 1;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .pdp-wish-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--white);
            border: 1px solid var(--ivory3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--text-muted);
            transition: all 0.3s;
        }
        .pdp-wish-btn:hover {
            border-color: var(--gold);
            color: var(--red);
        }
        
        .accordion {
            border-top: 1px solid var(--ivory3);
        }
        .accordion-item {
            border-bottom: 1px solid var(--ivory3);
        }
        .accordion-header {
            width: 100%;
            text-align: left;
            padding: 24px 0;
            background: transparent;
            border: none;
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 500;
            color: var(--brown);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .accordion-icon {
            font-size: 20px;
            color: var(--gold);
            transition: transform 0.3s;
        }
        .accordion-item.active .accordion-icon {
            transform: rotate(45deg);
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-main);
        }
        .accordion-content-inner {
            padding: 0 0 24px 0;
        }
        .key-features-list {
            list-style: none;
            padding: 0;
        }
        .key-features-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 10px;
        }
        .key-features-list li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--gold);
        }

        /* Loading State */
        .pdp-loading {
            text-align: center;
            padding: 140px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .pdp-loading .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .pdp-loading .loader-ring::before,
        .pdp-loading .loader-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }
        .pdp-loading .loader-ring::before {
            border: 3px solid rgba(201,151,58,0.15);
        }
        .pdp-loading .loader-ring::after {
            border: 3px solid transparent;
            border-top-color: var(--gold);
            border-right-color: rgba(201,151,58,0.4);
            animation: spin 0.9s cubic-bezier(0.4,0,0.2,1) infinite;
        }
        .pdp-loading .loader-paw {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            animation: pawPulse 1.8s ease-in-out infinite;
        }
        .pdp-loading .loader-glow {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,151,58,0.12) 0%, transparent 70%);
            animation: glowPulse 1.8s ease-in-out infinite;
        }
        .pdp-loading p {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            animation: shimmer 1.8s ease-in-out infinite;
        }
        .pdp-loading .loader-dots {
            display: flex;
            gap: 6px;
        }
        .pdp-loading .loader-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .pdp-loading .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
        .pdp-loading .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pawPulse { 0%,100% { transform: scale(1); opacity:0.8; } 50% { transform: scale(1.15); opacity:1; } }
        @keyframes glowPulse { 0%,100% { opacity:0.4; transform: scale(1); } 50% { opacity:1; transform: scale(1.1); } }
        @keyframes shimmer { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
        @keyframes dotBounce { 0%,80%,100% { transform: translateY(0); opacity:0.4; } 40% { transform: translateY(-6px); opacity:1; } }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="custom-cursor"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-emoji">🐾</span>
                <span class="logo-text">Petify</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html?category=Dogs">Dogs</a>
                <a href="products.html?category=Cats">Cats</a>
                <a href="products.html" class="active">Shop All</a>
            </div>
            <div class="nav-actions">
                <a href="products.html" class="icon-btn" title="Search products">🔍</a>
                <a href="login.html" class="icon-btn" id="nav-auth-link">👤</a>
                <button class="cart-pill-btn" id="open-cart-btn" onclick="document.getElementById('cart-overlay').classList.add('active'); document.getElementById('cart-drawer').classList.add('active');">
                    <span>Cart</span>
                    <div class="cart-badge" id="cart-count">0</div>
                </button>
            </div>
        </div>
    </nav>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <main id="main-content">
        <section class="pdp-section">
            <div id="pdp-content">
                <div class="pdp-loading">
                    <div class="loader-ring">
                        <div class="loader-glow"></div>
                        <div class="loader-paw">🐾</div>
                    </div>
                    <p>Loading product</p>
                    <div class="loader-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </section>
        <section id="reviews-section"></section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">
            <div class="footer-col brand-col">
                <a href="index.html" class="logo">
                    <span class="logo-emoji">🐾</span>
                    <span class="logo-text">Petify</span>
                </a>
                <p class="tagline">Where luxury meets unconditional love. Curated premium products for your furry family members.</p>
                <div class="social-links">
                    <a href="#" class="social-btn">Ig</a>
                    <a href="#" class="social-btn">Fb</a>
                    <a href="#" class="social-btn">Tw</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- CART DRAWER (Mock Structure for now, fully functional in cart.js) -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="document.getElementById('cart-overlay').classList.remove('active'); document.getElementById('cart-drawer').classList.remove('active');">✕</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total</span>
                <span id="cart-total-price">₹0</span>
            </div>
            <button class="btn-primary full-width" onclick="window.location.href='checkout.html'">Checkout →</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const pdpContent = document.getElementById('pdp-content');

            if (!productId) {
                pdpContent.innerHTML = '<div class="pdp-loading"><h2>Product Not Found.</h2><a href="products.html">Return to Shop</a></div>';
                return;
            }

            try {
                const product = await API.getProduct(productId);
                renderProductDetails(product);
            } catch (err) {
                pdpContent.innerHTML = '<div class="pdp-loading"><h2>Failed to load product.</h2><a href="products.html">Return to Shop</a></div>';
            }

            function renderProductDetails(p) {
                const isSale = p.oldPrice ? true : false;
                let badgeClass = 'badge-new';
                if (p.badge === 'Best Seller') badgeClass = 'badge-best';
                if (p.badge && (p.badge.includes('Off') || p.badge === 'Sale')) badgeClass = 'badge-sale';
                const badgeHtml = p.badge ? `<div class="prod-badge ${badgeClass} pdp-badge">${p.badge}</div>` : '';

                const featuresHtml = p.keyFeatures && p.keyFeatures.length > 0 
                    ? `<ul class="key-features-list">${p.keyFeatures.map(f => `<li>${f}</li>`).join('')}</ul>` 
                    : '<p>No specific features listed.</p>';

                const imgHtml = p.images && p.images.length > 0
                    ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; position:relative; z-index:1;">`
                    : `<div style="position:relative; z-index:1; transform: scale(1.5);">${p.emoji || '🐾'}</div>`;

                pdpContent.innerHTML = `
                    <div class="pdp-grid fade-up visible">
                        <div class="pdp-media">
                            <div class="pdp-main-img">
                                ${badgeHtml}
                                ${imgHtml}
                            </div>
                        </div>

                        <div class="pdp-details">
                            <div class="breadcrumb">
                                <a href="index.html">Home</a> / <a href="products.html?category=${p.category}">${p.category}</a> / ${p.name}
                            </div>
                            
                            <h1 class="pdp-title">${p.name}</h1>
                            
                            <div class="pdp-rating">
                                <span class="stars" style="letter-spacing:2px;">${renderStars(p.rating)}</span>
                                <span>${(p.rating || 0).toFixed(1)} / 5</span>
                                <span>(${p.numReviews} reviews)</span>
                            </div>

                            <div class="pdp-price-wrap">
                                ${isSale ? `<span class="pdp-old-price">₹${p.oldPrice}</span>` : ''}
                                <span class="pdp-price">₹${p.price}</span>
                            </div>

                            <p class="pdp-short-desc">${p.shortDescription}</p>

                            <div class="pdp-actions">
                                <div class="qty-selector">
                                    <button class="qty-btn" onclick="updateQty(-1)">-</button>
                                    <input type="number" id="pdp-qty" class="qty-input" value="1" min="1" max="${p.countInStock}">
                                    <button class="qty-btn" onclick="updateQty(1)">+</button>
                                </div>
                                <button class="btn-primary pdp-add-btn" id="pdp-add-btn" onclick="addToCartAnimation(event, '${p._id}', '${p.emoji || '🐾'}', '${p.name.replace(/'/g, "\\'")}')">Add to Cart</button>
                                <button class="pdp-wish-btn" data-product-id="${p._id}" onclick="toggleWishlist(event, this)">🤍</button>
                            </div>

                            <div class="accordion">
                                <div class="accordion-item" onclick="toggleAccordion(this)">
                                    <button class="accordion-header">
                                        Product Description <span class="accordion-icon">+</span>
                                    </button>
                                    <div class="accordion-content">
                                        <div class="accordion-content-inner">
                                            ${p.description}
                                        </div>
                                    </div>
                                </div>
                                <div class="accordion-item" onclick="toggleAccordion(this)">
                                    <button class="accordion-header">
                                        Key Features <span class="accordion-icon">+</span>
                                    </button>
                                    <div class="accordion-content">
                                        <div class="accordion-content-inner">
                                            ${featuresHtml}
                                        </div>
                                    </div>
                                </div>
                                <div class="accordion-item" onclick="toggleAccordion(this)">
                                    <button class="accordion-header">
                                        Shipping & Returns <span class="accordion-icon">+</span>
                                    </button>
                                    <div class="accordion-content">
                                        <div class="accordion-content-inner">
                                            Free delivery on orders over ₹999. Easy 30-day returns if product is unused and in original packaging.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Accordion Logic
            window.toggleAccordion = function(item) {
                const content = item.querySelector('.accordion-content');
                const isActive = item.classList.contains('active');
                
                // Close all
                document.querySelectorAll('.accordion-item').forEach(el => {
                    el.classList.remove('active');
                    el.querySelector('.accordion-content').style.maxHeight = null;
                    el.querySelector('.accordion-icon').textContent = '+';
                });

                if (!isActive) {
                    item.classList.add('active');
                    content.style.maxHeight = content.scrollHeight + "px";
                    item.querySelector('.accordion-icon').textContent = '✕';
                }
            };

            // Qty logic
            window.updateQty = function(change) {
                const input = document.getElementById('pdp-qty');
                let val = parseInt(input.value) + change;
                const max = parseInt(input.max);
                if (val < 1) val = 1;
                if (val > max) val = max;
                input.value = val;
            };

            // ── Reviews Section ────────────────────────────────────────
            loadReviews(productId);

            // Custom Add To Cart hook for PDP (to read qty)
            const originalAddToCart = window.addToCartAnimation;
            window.addToCartAnimation = function(e, id, emoji, name) {
                const qty = parseInt(document.getElementById('pdp-qty').value) || 1;
                // Call original visual animation
                originalAddToCart(e, id, emoji, name);
                // Add with correct qty to cart (original only adds 1)
                if (qty > 1 && window.cartManager) {
                    // qty-1 already added by originalAddToCart, add the rest
                    for (let i = 1; i < qty; i++) {
                        window.cartManager.addToCart(id, 1);
                    }
                }
            };
        });

        // ── Reviews Loader & Renderer ─────────────────────────────────
        async function loadReviews(productId) {
            const section = document.getElementById('reviews-section');
            if (!section) return;
            try {
                const reviews = await API.getReviews(productId);
                renderReviews(reviews, productId);
            } catch(e) {
                console.error('Failed to load reviews', e);
            }
        }

        function renderReviews(reviews, productId) {
            const section = document.getElementById('reviews-section');
            const token = localStorage.getItem('petify_token');
            const user  = JSON.parse(localStorage.getItem('petify_user') || 'null');

            const existing = reviews.find(r => r.user === user?.id);

            const starsHtml = (n) => [1,2,3,4,5].map(i =>
                `<span class="rv-star" data-val="${i}" style="cursor:pointer;font-size:28px;color:${i<=n?'var(--gold)':'var(--ivory3)'};">★</span>`
            ).join('');

            const formHtml = token ? `
                <div class="rv-form-wrap">
                    <h4 style="font-family:var(--font-serif);font-size:20px;color:var(--brown);margin-bottom:16px;">${existing ? '✏️ Update Your Review' : '✍️ Write a Review'}</h4>
                    <div style="margin-bottom:12px;">
                        <div id="star-picker" style="display:flex;gap:4px;margin-bottom:8px;">${starsHtml(existing?.rating||0)}</div>
                        <input type="hidden" id="rv-rating" value="${existing?.rating||0}">
                    </div>
                    <textarea id="rv-comment" rows="3" placeholder="Share your experience with this product..." style="width:100%;padding:12px 16px;border:1.5px solid rgba(201,151,58,0.25);border-radius:12px;font-family:inherit;font-size:14px;color:var(--brown);resize:vertical;outline:none;transition:border-color 0.2s;">${existing?.comment||''}</textarea>
                    <div style="display:flex;gap:12px;margin-top:12px;">
                        <button onclick="submitReview('${productId}')" style="padding:10px 28px;border-radius:999px;background:linear-gradient(135deg,var(--brown),var(--gold));color:#fff;border:none;font-weight:600;cursor:pointer;font-size:14px;">Submit Review</button>
                        ${existing ? `<button onclick="deleteReview('${productId}')" style="padding:10px 20px;border-radius:999px;background:transparent;border:1.5px solid rgba(220,53,69,0.4);color:#dc3545;font-size:14px;cursor:pointer;">Delete</button>` : ''}
                    </div>
                </div>` :
                `<p style="font-size:14px;color:var(--text-muted);margin-bottom:20px;"><a href="login.html" style="color:var(--gold);font-weight:600;">Sign in</a> to leave a review.</p>`;

            const listHtml = reviews.length === 0 ? `<p style="color:var(--text-muted);font-size:14px;padding:20px 0;">No reviews yet — be the first! 🐾</p>` :
                reviews.map(r => {
                    const date = new Date(r.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
                    return `
                    <div style="padding:18px 0;border-bottom:1px solid var(--ivory3);">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--brown));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;">${r.name.charAt(0).toUpperCase()}</div>
                                <div>
                                    <div style="font-weight:600;font-size:14px;color:var(--brown);">${r.name}</div>
                                    <div style="font-size:11px;color:var(--text-muted);">${date}</div>
                                </div>
                            </div>
                            <div>${[1,2,3,4,5].map(i=>`<span style="color:${i<=r.rating?'var(--gold)':'var(--ivory3)'};font-size:14px;">★</span>`).join('')}</div>
                        </div>
                        <p style="font-size:14px;color:var(--text-main);line-height:1.6;margin:0;padding-left:46px;">${r.comment}</p>
                    </div>`;
                }).join('');

            section.innerHTML = `
                <div style="max-width:1400px;margin:0 auto;padding:60px 40px;border-top:1px solid var(--ivory3);">
                    <h2 style="font-family:var(--font-serif);font-size:36px;color:var(--brown);margin-bottom:40px;">Customer Reviews</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;">
                        <div>${listHtml}</div>
                        <div>${formHtml}</div>
                    </div>
                </div>`;

            // Wire up star picker
            document.querySelectorAll('.rv-star').forEach(s => {
                s.addEventListener('mouseenter', () => {
                    const v = parseInt(s.dataset.val);
                    document.querySelectorAll('.rv-star').forEach((st,i) => st.style.color = i<v?'var(--gold)':'var(--ivory3)');
                });
                s.addEventListener('mouseleave', () => {
                    const cur = parseInt(document.getElementById('rv-rating').value);
                    document.querySelectorAll('.rv-star').forEach((st,i) => st.style.color = i<cur?'var(--gold)':'var(--ivory3)');
                });
                s.addEventListener('click', () => {
                    document.getElementById('rv-rating').value = s.dataset.val;
                    const cur = parseInt(s.dataset.val);
                    document.querySelectorAll('.rv-star').forEach((st,i) => st.style.color = i<cur?'var(--gold)':'var(--ivory3)');
                });
            });
        }

        window.submitReview = async function(productId) {
            const rating  = parseInt(document.getElementById('rv-rating').value);
            const comment = document.getElementById('rv-comment').value.trim();
            if (!rating)  { showToast('⭐ Please select a star rating.'); return; }
            if (!comment) { showToast('✏️ Please write a comment.'); return; }
            try {
                await API.submitReview(productId, { rating, comment });
                showToast('✅ Review submitted!');
                // Refresh reviews and product rating
                const reviews = await API.getReviews(productId);
                renderReviews(reviews, productId);
                // Refresh displayed product rating
                const product = await API.getProduct(productId);
                document.querySelector('.pdp-rating').innerHTML = `
                    <span class="stars" style="letter-spacing:2px;">${renderStars(product.rating)}</span>
                    <span>${(product.rating||0).toFixed(1)} / 5</span>
                    <span>(${product.numReviews} reviews)</span>`;
            } catch(e) {
                showToast('❌ ' + (e.message || 'Failed to submit review.'));
            }
        };

        window.deleteReview = async function(productId) {
            if (!confirm('Delete your review?')) return;
            try {
                await API.deleteReview(productId);
                showToast('🗑️ Review deleted.');
                loadReviews(productId);
            } catch(e) {
                showToast('❌ ' + (e.message || 'Failed to delete review.'));
            }
        };
    </script>

    <script src="js/chatbot.js"></script>
</body>
</html>
